<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Planner</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f5f0;
            color: #4a403a;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .page {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 2px solid #e6dfd5;
        }
        /* Header */
        .header-decor {
            text-align: center;
            color: #8c7b6e;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        h1 {
            text-align: center;
            color: #2c2522;
            font-size: 28px;
            letter-spacing: 3px;
            margin: 5px 0 10px 0;
            font-weight: 700;
        }
        /* Date Bar */
        .date-bar {
            background-color: #a39283;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
        }
        .days-list span {
            margin-left: 6px;
            opacity: 0.85;
        }
        .days-list span.active {
            opacity: 1;
            font-weight: bold;
            text-decoration: underline;
        }

        /* Layout Grid */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .col {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* Card Boxes */
        .box {
            background: #fbf9f6;
            border: 1px.solid #ebdcd0;
            border-radius: 10px;
            padding: 12px 15px;
            position: relative;
        }
        .box-title {
            background-color: #a39283;
            color: white;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        /* Items inside boxes */
        .line-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .line-item span.num {
            width: 18px;
            height: 18px;
            background: #a39283;
            color: white;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            margin-right: 8px;
        }
        .line-item .blank-line {
            flex-grow: 1;
            border-bottom: 1px dotted #ccbdae;
            margin-left: 5px;
            height: 14px;
        }

        /* Schedule specific */
        .schedule-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            margin-bottom: 6px;
            color: #6b5e52;
        }
        .schedule-row .time {
            font-weight: 600;
            width: 50px;
        }
        .schedule-row .line {
            flex-grow: 1;
            border-bottom: 1px dotted #ccbdae;
            height: 12px;
            margin-left: 8px;
        }

        /* Small boxes row */
        .small-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 10px;
        }

        /* Checkboxes */
        .checkbox {
            width: 10px;
            height: 10px;
            border: 1px solid #a39283;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        /* Notes box full width */
        .full-box {
            grid-column: span 2;
        }
        .note-lines {
            margin-top: 5px;
        }
        .note-line {
            border-bottom: 1px dotted #ccbdae;
            height: 18px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="page">
    <div class="header-decor">────── ◉ ──────</div>
    <h1>DAILY PLANNER</h1>
    <div class="header-decor">────── ◉ ──────</div>

    <!-- Date & Days Bar -->
    <div class="date-bar">
        <div>Date: _____ / _____ / _____</div>
        <div class="days-list">
            Day: 
            <span>S</span> <span>M</span> <span>T</span> <span>W</span> <span>T</span> <span>F</span> <span>S</span>
        </div>
    </div>

    <div class="grid-container">
        
        <!-- Left Column -->
        <div class="col">
            <!-- Top Priorities -->
            <div class="box">
                <div class="box-title">Top Priorities</div>
                <div class="line-item"><span class="num">1</span><div class="blank-line"></div></div>
                <div class="line-item"><span class="num">2</span><div class="blank-line"></div></div>
                <div class="line-item"><span class="num">3</span><div class="blank-line"></div></div>
                <div class="line-item"><span class="num">4</span><div class="blank-line"></div></div>
            </div>

            <!-- Goal For Today -->
            <div class="box">
                <div class="box-title">Goal For Today</div>
                <div class="line-item"><span class="checkbox"></span><div class="blank-line"></div></div>
                <div class="line-item"><span class="checkbox"></span><div class="blank-line"></div></div>
                <div class="line-item"><span class="checkbox"></span><div class="blank-line"></div></div>
                <div class="line-item"><span class="checkbox"></span><div class="blank-line"></div></div>
            </div>

            <!-- Reminders & Urgent row -->
            <div class="small-row">
                <div class="box" style="margin:0;">
                    <div class="box-title" style="background-color: #8c7b6e;">Reminders</div>
                    <div class="note-line" style="margin-top:5px;"></div>
                    <div class="note-line"></div>
                    <div class="note-line"></div>
                </div>
                <div class="box" style="margin:0;">
                    <div class="box-title" style="background-color: #b5836d;">Urgent</div>
                    <div class="note-line" style="margin-top:5px;"></div>
                    <div class="note-line"></div>
                </div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="col">
            <!-- Schedule -->
            <div class="box">
                <div class="box-title">Schedule</div>
                <div class="schedule-row"><span class="time">05.00</span><div class="line"></div></div>
                <div class="schedule-row"><span class="time">06.00</span><div class="line"></div></div>
                <div class="schedule-row"><span class="time">07.00</span><div class="line"></div></div>
                <div class="schedule-row"><span class="time">08.00</span><div class="line"></div></div>
                <div class="schedule-row"><span class="time">09.00</span><div class="line"></div></div>
                <div class="schedule-row"><span class="time">10.00</span><div class="line"></div></div>
                <div class="schedule-row"><span class="time">11.00</span><div class="line"></div></div>
                <div class="schedule-row"><span class="time">12.00</span><div class="line"></div></div>
                <div class="schedule-row"><span class="time">13.00</span><div class="line"></div></div>
                <div class="schedule-row"><span class="time">14.00</span><div class="line"></div></div>
                <div class="schedule-row"><span class="time">15.00</span><div class="line"></div></div>
                <div class="schedule-row"><span class="time">16.00</span><div class="line"></div></div>
            </div>

            <!-- Self-Care -->
            <div class="box">
                <div class="box-title">Self-Care</div>
                <div class="line-item"><span class="checkbox"></span> Drink Water <div class="blank-line" style="max-width: 60px;"></div></div>
                <div class="line-item"><span class="checkbox"></span> Take a Break <div class="blank-line" style="max-width: 60px;"></div></div>
                <div class="line-item"><span class="checkbox"></span> Get Enough Sleep <div class="blank-line" style="max-width: 60px;"></div></div>
            </div>
        </div>

        <!-- Notes Full Width -->
        <div class="box full-box">
            <div class="box-title">Notes</div>
            <div class="note-lines">
                <div class="note-line"></div>
                <div class="note-line"></div>
                <div class="note-line"></div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
